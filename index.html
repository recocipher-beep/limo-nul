<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIMO Processor Simulator</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background: #1e1e1e; color: #d4d4d4; padding: 20px; }
        h1, h2 { color: #4ec9b0; }
        .container { display: flex; gap: 20px; margin-top: 20px; }
        .panel { flex: 1; background: #252526; padding: 15px; border: 1px solid #333; border-radius: 5px; }
        textarea { width: 100%; height: 300px; background: #1e1e1e; color: #ce9178; border: 1px solid #333; padding: 10px; font-family: monospace; font-size: 14px; resize: vertical; }
        button { background: #0e639c; color: white; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #1177bb; }
        #output { white-space: pre-wrap; line-height: 1.6; }
        .error { color: #f48771; }
        .success { color: #89d185; }
    </style>
</head>
<body>
    <h1>LIMO Processor Simulator</h1>
    
    <div class="container">
        <div class="panel">
            <h2>Assembly Code</h2>
            <textarea id="sourceCode">kpn R7, R5, R6
kpnh R5, R0, 1
bl R6, 4(R10)</textarea>
            <br>
            <button onclick="runAssembler()">Assemble Code</button>
        </div>
        
        <div class="panel">
            <h2>Machine Code</h2>
            <div id="output">Click "Assemble Code" to see the output.</div>
        </div>
    </div>

    <!-- Load the Assembler JS files -->
    <script src="src/assembler.js"></script>
    <script src="src/parser.js"></script>
    <script src="src/encoder.js"></script>
    <script src="src/main.js"></script>

    <script>
        function runAssembler() {
            const code = document.getElementById('sourceCode').value;
            const outputDiv = document.getElementById('output');
            
            try {
                // Call your main assembly function
                const result = assembleProgram(code);
                outputDiv.innerHTML = "";
                
                if (!result.success) {
                    result.errors.forEach(err => {
                        outputDiv.innerHTML += `<div class="error">❌ ${err}</div>`;
                    });
                } else {
                    outputDiv.innerHTML += `<div class="success">✅ Assembly Successful!</div><br>`;
                    result.machineCode.forEach(line => {
                        outputDiv.innerHTML += `Line ${line.lineNumber}: ${line.hex} <br><span style="color:#858585">Bin: ${line.binary}</span><br><br>`;
                    });
                }
            } catch (e) {
                outputDiv.innerHTML = `<div class="error">System Error: ${e.message}</div>`;
            }
        }
    </script>
</body>
</html>
